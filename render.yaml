services:
  - type: web
    name: loanflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter
    disk:
      name: loanflow-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MONGODB_URL
        sync: false
      - key: CLIENT_URL
        value: https://loan-flow-dkte.vercel.app
      - key: JWT_SECRET
        generateValue: true
